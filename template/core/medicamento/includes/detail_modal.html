<!-- templates/medicamentos/includes/detail_modal.html -->
<div class="modal fade" id="medicamentoModal" tabindex="-1" aria-labelledby="medicamentoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary bg-opacity-75">
                <h5 class="modal-title text-white fw-bold" id="medicamentoModalLabel">
                    <i class="fas fa-pills me-2"></i>Detalles del Medicamento
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- Columna para los detalles del medicamento -->
                    <div class="col-md-12">
                        <p><strong><i class="fas fa-hashtag me-2"></i>Id:</strong> <span id="medicamento-id"></span></p>
                        <p><strong><i class="fas fa-pills me-2"></i>Nombre:</strong> <span id="medicamento-nombre"></span></p>
                        <p><strong><i class="fas fa-tag me-2"></i>Tipo:</strong> <span id="medicamento-tipo"></span></p>
                        <p><strong><i class="fas fa-clipboard-list me-2"></i>Descripción:</strong> <span id="medicamento-descripcion"></span></p>
                        <p><strong><i class="fas fa-flask me-2"></i>Concentración:</strong> <span id="medicamento-concentracion"></span></p>
                        <p><strong><i class="fas fa-box me-2"></i>Stock:</strong> <span id="medicamento-cantidad"></span></p>
                        <p><strong><i class="fas fa-dollar-sign me-2"></i>Precio:</strong> $<span id="medicamento-precio"></span></p>
                        <p><strong><i class="fas fa-store me-2"></i>Comercial:</strong> <span id="medicamento-comercial"></span></p>
                        <p><strong><i class="fas fa-check-circle me-2"></i>Activo:</strong> <span id="medicamento-activo"></span></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times me-2"></i>Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
