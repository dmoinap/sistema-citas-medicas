<!-- templates/includes/audit_user_detail_modal.html -->
<div class="modal fade" id="auditModal" tabindex="-1" aria-labelledby="auditModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Encabezado del Modal -->
            <div class="modal-header bg-primary bg-opacity-75">
                <h5 class="modal-title text-white fw-bold" id="auditModalLabel">
                    <i class="fas fa-info-circle me-2"></i>Detalles del Registro de Auditoría
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Cuerpo del Modal -->
            <div class="modal-body">
                <div class="row">
                    <!-- Información principal del registro de auditoría -->
                    <div class="col-md-12">
                        <p>
                            <strong><i class="fas fa-user me-2"></i>ID:</strong> 
                            <span id="audit-id"></span>
                        </p>
                        <p>
                            <strong><i class="fas fa-user-circle me-2"></i>Usuario:</strong> 
                            <span id="audit-usuario"></span>
                        </p>
                        <p>
                            <strong><i class="fas fa-tasks me-2"></i>Acción:</strong> 
                            <span id="audit-accion"></span>
                        </p>
                        <p>
                            <strong><i class="fas fa-calendar-alt me-2"></i>Fecha:</strong> 
                            <span id="audit-fecha"></span>
                        </p>
                        <p>
                            <strong><i class="fas fa-clock me-2"></i>Hora:</strong> 
                            <span id="audit-hora"></span>
                        </p>
                        <p>
                            <strong><i class="fas fa-table me-2"></i>Tabla:</strong> 
                            <span id="audit-tabla"></span>
                        </p>
                        <p>
                            <strong><i class="fas fa-desktop me-2"></i>Estación:</strong> 
                            <span id="audit-estacion"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Pie del Modal -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times me-2"></i>Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
