<!-- templates/includes/servicio_detail_modal.html -->
<div class="modal fade" id="servicioModal" tabindex="-1" aria-labelledby="servicioModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary bg-opacity-75">
                <h5 class="modal-title text-white fw-bold" id="servicioModalLabel">
                    <i class="fas fa-concierge-bell me-2"></i>Detalles del Servicio Adicional
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- Columna para los detalles -->
                    <div class="col-md-12">
                        <p><strong><i class="fas fa-tag me-2"></i>Servicio:</strong> <span id="servicio-nombre"></span></p>
                        <p><strong><i class="fas fa-info-circle me-2"></i>Descripción:</strong> <span id="servicio-descripcion"></span></p>
                        <p><strong><i class="fas fa-dollar-sign me-2"></i>Costo del Servicio:</strong> <span id="servicio-precio"></span></p>
                        <p><strong><i class="fas fa-clock me-2"></i>Estado:</strong> <span id="servicio-estado"></span></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times me-2"></i>Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
